name: Mutation testing

# Nightly: how many deliberate bugs in the calculation crates do the tests catch? (docs/coding.md, rule 8)
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: rustup toolchain install  # the pin in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Mutation testing (score in the run summary)
        # A mutant can make a test allocate without end. The cap kills that test, not the runner (#272).
        run: >-
          sudo env "PATH=$PATH" "GITHUB_STEP_SUMMARY=$GITHUB_STEP_SUMMARY" "HOME=$HOME" "CARGO_INCREMENTAL=$CARGO_INCREMENTAL"
          "GITHUB_ACTION=$GITHUB_ACTION"
          systemd-run --scope --quiet --uid="$(id -u)" --gid="$(id -g)"
          -p MemoryMax=12G -p MemorySwapMax=0 -p OOMPolicy=continue
          npm run mutants
