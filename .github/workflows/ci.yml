name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Scorecard (written into the run summary)
        run: npm run scorecard

  # Spike #23, throwaway: the DMX timing loop with the mock sink. A job of its own,
  # so it does not slow `test`. Numbers on a shared runner are only a smoke check.
  dmx-timing-spike:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            priority: default
          - os: macos-latest
            priority: realtime
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: spikes/dmx-timing
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/dmx-timing
      - run: cargo test --release
      - name: 20 s mock run (written into the run summary)
        run: |
          cargo run -q --release -- --priority ${{ matrix.priority }} --wait spin --seconds 20 \
            --label "ci ${{ matrix.os }} ${{ matrix.priority }} spin" | tee -a "$GITHUB_STEP_SUMMARY"
