name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: rustup toolchain install  # the pin in rust-toolchain.toml, with clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # no recommends: the desktop portal they bring never answers on the runner's session bus, and GTK waits on it before the window exists (#256)
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: System libraries for Chromium
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - run: npm test
        if: runner.os != 'Linux'
      - name: npm test (with a display, for the shell's window)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
