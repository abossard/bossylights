[package]
name = "shell"
description = "The desktop shell: starts the engine process and shows the web UI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "bossylights"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
engine-core = { path = "../crates/engine-core" } # the API version it speaks
tauri = { version = "2.12.6", features = [] }
tungstenite = "0.29.0" # sends the API's Stop when the app quits
