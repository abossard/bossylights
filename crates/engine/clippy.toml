# The tick thread does five things less (docs/coding.md, rule 7).
# This crate holds the real-time core, so anything that can lock, block, do I/O or log is banned here.
disallowed-types = [
  { path = "std::sync::Mutex", reason = "the tick thread never locks" },
  { path = "std::sync::RwLock", reason = "the tick thread never locks" },
  { path = "std::sync::Condvar", reason = "the tick thread never waits on others" },
  { path = "std::sync::Barrier", reason = "the tick thread never waits on others" },
  { path = "std::sync::Once", reason = "can block" },
  { path = "std::sync::OnceLock", reason = "can block" },
  { path = "std::sync::LazyLock", reason = "can block" },
  { path = "std::sync::mpsc::Sender", reason = "channels lock and allocate" },
  { path = "std::sync::mpsc::SyncSender", reason = "channels lock and allocate" },
  { path = "std::sync::mpsc::Receiver", reason = "channels lock and allocate" },
  { path = "std::fs::File", reason = "the tick thread does no file I/O" },
  { path = "std::fs::OpenOptions", reason = "the tick thread does no file I/O" },
  { path = "std::net::TcpStream", reason = "the tick thread does no network I/O" },
  { path = "std::net::TcpListener", reason = "the tick thread does no network I/O" },
  { path = "std::net::UdpSocket", reason = "the tick thread does no network I/O" },
  { path = "std::process::Command", reason = "the tick thread starts nothing" },
  { path = "std::io::Stdin", reason = "blocks" },
  { path = "std::io::Stdout", reason = "logging: stdout takes a lock" },
  { path = "std::io::Stderr", reason = "logging: stderr takes a lock" },
]
disallowed-methods = [
  { path = "std::fs::read", reason = "the tick thread does no file I/O" },
  { path = "std::fs::read_to_string", reason = "the tick thread does no file I/O" },
  { path = "std::fs::write", reason = "the tick thread does no file I/O" },
  { path = "std::io::stdin", reason = "blocks" },
  { path = "std::io::stdout", reason = "logging: stdout takes a lock" },
  { path = "std::io::stderr", reason = "logging: stderr takes a lock" },
]
disallowed-macros = [
  { path = "std::println", reason = "stdout takes a lock" },
  { path = "std::print", reason = "stdout takes a lock" },
  { path = "std::eprintln", reason = "stderr takes a lock" },
  { path = "std::eprint", reason = "stderr takes a lock" },
  { path = "std::dbg", reason = "stderr takes a lock" },
]
