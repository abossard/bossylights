[package]
name = "engine"
description = "The Bossylights engine: takes commands, runs the tick thread around the real-time core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
engine-core = { path = "../engine-core" }
rt-thread = { path = "../rt-thread" }
outputs = { path = "../outputs" }
rig = { path = "../rig" }
looks = { path = "../looks" }
fixture-library = { path = "../fixture-library" }
rtrb = "0.4.1"

[features]
# A clock a test steps one wake at a time, and a trace of each due hand-over (src/wake.rs).
# Only tests turn it on: without it the tick reads the wall and writes no trace.
test-support = ["engine-core/test-support"]

[[test]]
name = "no_alloc"
harness = false
# Its stepped clock and trace walk the cutover and health paths: never skipped quietly.
required-features = ["test-support"]

# These open their devices through tests/mock, which attaches them: test-support only.

[[test]]
name = "channel_core"
required-features = ["test-support"]

[[test]]
name = "commands"
required-features = ["test-support"]

[[test]]
name = "stalled_free_thread_bounds"
required-features = ["test-support"]

[[test]]
name = "patch"
required-features = ["test-support"]

[[test]]
name = "routes"
required-features = ["test-support"]

[[test]]
name = "sequence_admission"
required-features = ["test-support"]

[[test]]
name = "snapshot"
required-features = ["test-support"]

[[test]]
name = "loop_budget"
required-features = ["test-support"]

[[test]]
name = "tick"
required-features = ["test-support"]
