[package]
name = "engine"
description = "The Bossylights engine: takes commands, runs the tick thread around the real-time core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
engine-core = { path = "../engine-core" }
rt-thread = { path = "../rt-thread" }
outputs = { path = "../outputs" }
rig = { path = "../rig" }
looks = { path = "../looks" }
fixture-library = { path = "../fixture-library" }
rtrb = "0.4.1"

[features]
# A clock a test steps one wake at a time, and a trace of each due hand-over (src/wake.rs).
# Only tests turn it on: without it the tick reads the wall and writes no trace.
test-support = ["engine-core/test-support"]

[[test]]
name = "no_alloc"
harness = false
