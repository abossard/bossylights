[package]
name = "engine-server"
description = "The headless engine process: runs the engine and serves its API on localhost."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "bossylights-engine"
path = "src/main.rs"

[[example]]
name = "wled_pattern"
test = true # its pixel arithmetic has a test

[[example]]
name = "send_to_frame"
test = true

[dependencies]
engine = { path = "../engine" }
engine-core = { path = "../engine-core" } # the API types of the fixture library
fixture-library = { path = "../fixture-library" }
show-file = { path = "../show-file" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "time", "sync"] }

[dev-dependencies]
engine = { path = "../engine", features = ["test-support"] } # m3_wake steps the tick
outputs = { path = "../outputs" } # the hands-on checks find the adapter of a port
rtrb = "0.4.1"
serialport = { version = "4.10.1", default-features = false } # a fake serial port in tests
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
tokio-tungstenite = "0.29.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] } # one test runs on threads
