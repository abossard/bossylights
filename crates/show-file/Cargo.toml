[package]
name = "show-file"
description = "The show file: the patch and the groups as JSON text, and back, checked as the commands check them. A calculation: reads no files."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
engine-core = { path = "../engine-core" }
fixture-library = { path = "../fixture-library" }
rig = { path = "../rig" }
looks = { path = "../looks" }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }
