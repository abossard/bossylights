[package]
name = "outputs"
description = "Every output kind and its bytes: open a device off the output thread, then take frames on it without waiting. DDP, Art-Net, sACN, DMX USB Pro."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
engine-core = { path = "../engine-core" }
rtrb = "0.4.1"
serialport = { version = "4.10.1", default-features = false }
nix = { version = "0.26.4", default-features = false, features = ["fs", "net"] }
socket2 = { version = "0.6.5", features = ["all"] } # MIT OR Apache-2.0: shares port 6454 with other programs

[dev-dependencies]
artnet_protocol = "0.4.4" # MIT: an outside decoder for the Art-Net tests
sacn = "0.11.1" # MIT OR Apache-2.0: an outside decoder for the sACN tests

[[test]]
name = "no_alloc"
harness = false
