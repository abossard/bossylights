[package]
name = "engine-core"
description = "The real-time core: state, commands, update and the frame schedule. No std, no alloc."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
ts-rs = { version = "12.0.1", optional = true } # only the generator test of `crates/wire` turns it on

[features]
# A kind for tests outside engine-core (TEST_KIND), which name none.
test-support = []
# The TypeScript types of the API. No product build has it.
ts = ["dep:ts-rs"]
