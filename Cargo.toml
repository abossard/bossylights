[workspace]
resolver = "3"
members = ["crates/engine-core", "crates/fixture-library", "crates/rig", "crates/looks", "crates/show-file", "crates/rt-thread", "crates/outputs", "crates/engine", "crates/audio-in", "crates/engine-server", "shell"]
exclude = ["spikes"] # throwaway spikes build on their own, outside the product checks

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# docs/coding.md: rule 3 (state machines) and rule 6 (errors). Every package uses these.
# The core crates add unwrap_used, expect_used, panic and indexing_slicing in their lib.rs.
[workspace.lints.rust]
unsafe_code = "deny" # each crate root forbids it; only rt-thread and the allocation guard test may expect it

[workspace.lints.clippy]
struct_excessive_bools = "deny"
fn_params_excessive_bools = "deny"
wildcard_enum_match_arm = "deny"
allow_attributes_without_reason = "deny"
