[package]
name = "surface-scale-engine"
description = "Spike #24, throwaway: the product engine's 44 Hz tick plus spike-only state and a command path."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
engine = { path = "../../../crates/engine" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
